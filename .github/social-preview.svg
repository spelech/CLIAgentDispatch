<text x="80" y="378" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">bridging local execution engines with FastMCP.</text>

  <!-- Topic & Language Pills -->
  <g transform="translate(80, 498)"><rect width="120" height="46" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.65" /><text x="60" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">v0.6.0</text></g><g transform="translate(216, 498)"><rect width="120" height="46" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65" /><text x="60" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">Python</text></g><g transform="translate(352, 498)"><rect width="274" height="46" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65" /><text x="137" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">#agent-delegation</text></g><g transform="translate(642, 498)"><rect width="176" height="46" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65" /><text x="88" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">#ai-agents</text></g>

