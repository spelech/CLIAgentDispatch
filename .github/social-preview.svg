<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect x="0" y="0" width="1280" height="10" fill="url(#accent)" />
  <rect x="40" y="40" width="1200" height="560" rx="24" fill="#0B1324" fill-opacity="0.78" stroke="#1E293B" stroke-width="2" />

  <!-- Top Domain Header -->
  <text x="80" y="114" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="3">AI, LLM ORCHESTRATION &amp; MCP INFRASTRUCTURE</text>

  <!-- Repo Owner & Title -->
  <text x="80" y="190" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="32" font-weight="500">spelech /</text>
  <text x="80" y="264" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">CLIAgentDispatch</text>

