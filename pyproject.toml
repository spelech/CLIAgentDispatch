[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-agent-dispatch"
version = "0.1.0"
description = "Universal CLI & Headless AI Agent Delegation Engine for MCG, LiteLLM, and LibreChat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
cli-agent-dispatch = "cli_agent_dispatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent_dispatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=cli_agent_dispatch --cov-report=term-missing --cov-fail-under=80"
